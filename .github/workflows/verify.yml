name: Verify frontend and stage A

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tujiang
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: tujiang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tujiang -d tujiang_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tujiang:ci_only@127.0.0.1:5432/tujiang_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Verify real PostgreSQL migrations, receipts and recovery
        run: npm run test:postgres
        working-directory: backend
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend
        run: npm ci --ignore-scripts
      - name: Install backend
        run: npm ci --ignore-scripts
        working-directory: backend
      - name: Install fixed Chromium for renderer tests
        run: npx playwright install chromium --only-shell --with-deps
        working-directory: backend
      - name: Check frontend types and lint
        run: npm run lint
      - name: Build frontend
        run: npx vite build
      - name: Check backend types
        run: npm run typecheck
        working-directory: backend
      - name: Test stage A with synthetic gateways
        run: npm test
        working-directory: backend
      - name: Build backend
        run: npm run build
        working-directory: backend
