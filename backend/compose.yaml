services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tujiang
      POSTGRES_PASSWORD: tujiang_local
      POSTGRES_DB: tujiang
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - tujiang_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tujiang -d tujiang"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tujiang_pg:
